name: reusable quality checks

on:
  workflow_call:
    inputs:
      tooling-ref:
        required: true
        type: string
      unit-suite:
        type: string
        default: none

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Thornbots/thornbots_workspace
          ref: ${{ inputs.tooling-ref }}
          path: tooling
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tooling/.github/quality/requirements.txt
      - name: Test lint gates
        run: python -m unittest discover -s tooling/.github/quality -p 'test_*.py' -v
      - name: Lint all tracked first-party files
        working-directory: source
        run: python ../tooling/.github/quality/check.py
      - name: Check workflow syntax and expressions
        working-directory: source
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output /tmp/actionlint.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -shellcheck=""
      - name: Test startup log handling
        if: inputs.unit-suite == 'startup'
        working-directory: source
        run: python -m unittest discover -s tests -v
      - name: Test common subprocess handling
        if: inputs.unit-suite == 'common'
        working-directory: source
        env:
          PYTHONPATH: isaac_common_py
        run: python -m pytest isaac_common_py/tests -q
