name: reusable quality checks

on:
  workflow_call:
    inputs:
      tooling-ref:
        required: true
        type: string
      unit-suite:
        type: string
        default: none

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Thornbots/thornbots_workspace
          ref: ${{ inputs.tooling-ref }}
          path: tooling
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r tooling/.github/quality/requirements.txt
      - name: Test lint gates
        run: python -m unittest discover -s tooling/.github/quality -p 'test_*.py' -v
      - name: Lint all tracked first-party files
        working-directory: source
        run: python ../tooling/.github/quality/check.py
      - name: Check workflow syntax and expressions
        working-directory: source
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output /tmp/actionlint.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -shellcheck=""
      - name: Test host helpers
        if: inputs.unit-suite != 'none'
        env:
          UNIT_SUITE: ${{ inputs.unit-suite }}
        run: bash tooling/.github/scripts/test_host_packages.sh source "$UNIT_SUITE"
      - name: Upload host test reports
        if: always() && inputs.unit-suite != 'none'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-tests-${{ inputs.unit-suite }}-${{ github.sha }}
          path: source/build/host-tests
          retention-days: 14
