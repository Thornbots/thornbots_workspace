# A workspace PR into main checks that every gitlink fast-forwards its
# package's .gitmodules branch; the merge then pushes those fast-forwards.
# The push needs the SUBMODULES_TOKEN secret: a fine-grained token with
# contents read/write on the Thornbots package repos.
name: advance submodules

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: advance-submodules-${{ github.ref }}

jobs:
  advance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the gitlinks fast-forward
        if: github.event_name == 'pull_request'
        run: .github/scripts/advance_submodules.sh --check
      - name: Push the fast-forwards
        if: github.event_name != 'pull_request'
        env:
          SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: .github/scripts/advance_submodules.sh --push
