name: publish robot image

on:
  push:
    branches: [main, nightly]
  pull_request:
    branches: [main, nightly]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: robot-image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/nightly' }}

jobs:
  publish:
    name: Robot image build and tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Make room for the Isaac ROS image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: ws/src
          submodules: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the pinned Isaac ROS CLI
        env:
          ISAAC_ROS_CLI_REF: release-4.6
        run: |
          python3 -m pip install uv==0.9.3
          bash ws/src/isaac_ros_common/scripts/install_isaac_ros_cli.sh
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Base layers (isaac_ros, realsense: ~38 min) are tagged by a hash of their
      # Dockerfiles and build args; with all of them pulled, only thornbots builds.
      - name: Pull cached base layers
        working-directory: ws/src
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          missing=""
          for base in $(DRY_RUN=1 bash isaac_ros_common/scripts/build_robot_image.sh | tail -n +2); do
            name="${base##*/}"
            cache="ghcr.io/thornbots/isaac-ros:base-${name%:latest}"
            if docker pull -q "$cache"; then
              docker tag "$cache" "$base"
            else
              missing="$missing $base"
            fi
          done
          echo "BASES_MISSING=$missing" >> "$GITHUB_ENV"
      - name: Build native JetPack image
        working-directory: ws/src
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bash isaac_ros_common/scripts/build_robot_image.sh
          source_tag=$(DRY_RUN=1 bash isaac_ros_common/scripts/build_robot_image.sh | head -n 1)
          docker image inspect "$source_tag" >/dev/null
          registry_tag="ghcr.io/thornbots/isaac-ros:sha-${GITHUB_SHA}-arm64-jetpack"
          docker tag "$source_tag" "$registry_tag"
          echo "ROBOT_REGISTRY_TAG=$registry_tag" >> "$GITHUB_ENV"
          echo "ROBOT_SOURCE_TAG=$source_tag" >> "$GITHUB_ENV"
      - name: Cache new base layers
        if: env.BASES_MISSING != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          for base in $BASES_MISSING; do
            name="${base##*/}"
            cache="ghcr.io/thornbots/isaac-ros:base-${name%:latest}"
            docker tag "$base" "$cache"
            docker push -q "$cache"
          done
      - name: Test the built ROS packages
        run: |
          docker run --rm --entrypoint /bin/bash "$ROBOT_REGISTRY_TAG" -c '
            set -eo pipefail
            source /opt/ros/jazzy/setup.bash
            source /workspaces/ros2_ws/install/setup.bash
            cd /workspaces/ros2_ws
            colcon test --return-code-on-test-failure --event-handlers console_direct+
            colcon test-result --verbose'
      - name: Publish immutable and branch tags
        if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'nightly' || github.event_name == 'workflow_dispatch')
        run: |
          docker push "$ROBOT_REGISTRY_TAG"
          branch_name="${GITHUB_REF_NAME//\//-}"
          branch_tag="ghcr.io/thornbots/isaac-ros:${branch_name}-arm64-jetpack"
          docker tag "$ROBOT_REGISTRY_TAG" "$branch_tag"
          docker push "$branch_tag"
          {
            echo "Robot image: \`$ROBOT_REGISTRY_TAG\`"
            echo "CLI image: \`$ROBOT_SOURCE_TAG\`"
            echo "Source: \`$GITHUB_SHA\` (exact package gitlinks)"
          } >> "$GITHUB_STEP_SUMMARY"
