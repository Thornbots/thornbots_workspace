name: ROS Jazzy

on:
  workflow_call:
    inputs:
      package-repo:
        description: Package directory, or workspace to test all portable packages
        required: true
        type: string
      workspace-ref:
        description: Pinned workspace commit supplying dependency gitlinks
        required: true
        type: string
      tooling-ref:
        description: Workspace commit supplying the CI scripts; defaults to workspace-ref
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      package-repo:
        description: GPU package to build on the provisioned Isaac ROS runner
        type: choice
        options: [realsense-yolov8-nitros-bridge, isaac_ros_common]
        required: true
      workspace-ref:
        description: Workspace revision supplying dependency gitlinks
        type: string
        default: nightly
        required: true

permissions:
  contents: read

jobs:
  # A warm run whose package keys all have a passing result only plans and looks
  # up; see docs/CI.md#warm-portable-ros-ci.
  portable:
    if: inputs.package-repo != 'isaac_ros_common' && inputs.package-repo != 'realsense-yolov8-nitros-bridge'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    env:
      PACKAGE_REPO: ${{ inputs.package-repo }}
      # Registry writes and exact state keys come only from trusted events here.
      TRUSTED: ${{ github.repository == 'Thornbots/thornbots_workspace' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
      MCB_FIRMWARE_ELF: src/firmware/MCBV3/MCB-project/build/sim/scons-release/MCB-project.elf
    steps:
      - name: Checkout pinned dependency workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Thornbots/thornbots_workspace
          ref: ${{ inputs.workspace-ref }}
          path: ws/src
          persist-credentials: false
      - name: Checkout portable packages
        working-directory: ws/src
        run: |
          case "$PACKAGE_REPO" in
            workspace|thornbots_pkg|sim|sentry_localization|rf2o_laser_odometry|ros2_dji_serial_bridge|Realsense_ROI_Depth_Rectifier|sllidar_ros2|nav_pkg) ;;
            *) echo "Unsupported portable package: $PACKAGE_REPO" >&2; exit 1 ;;
          esac
          git submodule update --init --checkout --depth 1 --jobs 9 -- \
            thornbots_pkg sim sentry_localization rf2o_laser_odometry \
            ros2_dji_serial_bridge Realsense_ROI_Depth_Rectifier sllidar_ros2 nav_pkg \
            robot_localization
      - name: Overlay the caller's tested revision
        if: github.repository != 'Thornbots/thornbots_workspace'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ws/src/${{ inputs.package-repo }}
          persist-credentials: false
      - name: Checkout CI tooling
        if: inputs.tooling-ref != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Thornbots/thornbots_workspace
          ref: ${{ inputs.tooling-ref }}
          path: tooling
          sparse-checkout: .github
          persist-credentials: false
      - name: Key packages by content and dependencies
        id: plan
        env:
          TOOLING: ${{ inputs.tooling-ref != '' && 'tooling' || 'ws/src' }}
        run: |
          echo "ROS_CI_TOOLING=$GITHUB_WORKSPACE/$TOOLING" >> "$GITHUB_ENV"
          firmware=()
          if [[ "$PACKAGE_REPO" == workspace ]]; then firmware=(--firmware); fi
          python3 "$TOOLING/.github/scripts/ros_ci.py" plan ws/src --scope "$PACKAGE_REPO" "${firmware[@]}" \
            --dockerfile "$TOOLING/.github/ros-ci/Dockerfile" --context "$RUNNER_TEMP/ros-ci-image" \
            --env-file "$TOOLING/.github/workflows/ros.yml" \
            --env-file "$TOOLING/.github/scripts/ros_ci.py" \
            --env-file "$TOOLING/.github/scripts/ros_ci_container.sh" \
            --out "$RUNNER_TEMP/plan.json"
      - name: Look up a passing result for every package key
        id: lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ws/install
            ws/.ros-ci/manifest.json
          key: ros-state-v1-${{ inputs.package-repo }}-${{ steps.plan.outputs.state }}
          lookup-only: true
      - name: Restore the newest install tree and its package keys
        id: state
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ws/install
            ws/.ros-ci/manifest.json
          key: ros-state-v1-${{ inputs.package-repo }}-${{ steps.plan.outputs.state }}
          restore-keys: ros-state-v1-${{ inputs.package-repo }}-
      - name: Select stale and untested packages
        id: select
        if: steps.lookup.outputs.cache-hit != 'true'
        working-directory: ws
        run: |
          mkdir -p .ros-ci
          cp "$RUNNER_TEMP/plan.json" .ros-ci/plan.json
          python3 "$ROS_CI_TOOLING/.github/scripts/ros_ci.py" select --plan .ros-ci/plan.json \
            --manifest .ros-ci/manifest.json --out .ros-ci
          echo "firmware=$(cat .ros-ci/firmware.txt)" >> "$GITHUB_OUTPUT"
          echo "build=$([[ -s .ros-ci/build.txt ]] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - name: Restore hosted firmware
        id: firmware
        if: steps.select.outputs.firmware == 'yes'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ws/${{ env.MCB_FIRMWARE_ELF }}
          key: mcb-sim-${{ steps.plan.outputs.firmware }}-${{ steps.plan.outputs.image }}
      - name: Checkout pinned firmware to build it
        if: steps.select.outputs.firmware == 'yes' && steps.firmware.outputs.cache-hit != 'true'
        working-directory: ws/src
        run: |
          git submodule update --init --checkout --depth 1 -- firmware/MCBV3
          git -C firmware/MCBV3 submodule update --init --checkout --depth 1 -- taproot-scripts
      - name: Restore compiler cache
        id: ccache
        if: steps.select.outputs.build == 'yes'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ws/.ccache
          key: ccache-v2-${{ steps.plan.outputs.image }}-${{ inputs.package-repo }}-${{ github.sha }}
          restore-keys: ccache-v2-${{ steps.plan.outputs.image }}-${{ inputs.package-repo }}-
      - name: Log in to publish the CI image
        if: steps.lookup.outputs.cache-hit != 'true' && env.TRUSTED == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull or build the content-tagged CI image
        if: steps.lookup.outputs.cache-hit != 'true'
        env:
          IMAGE: ghcr.io/thornbots/isaac-ros:${{ steps.plan.outputs.image }}
        run: |
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          if docker pull -q "$IMAGE"; then exit 0; fi
          echo "::notice title=CI image::building $IMAGE (inputs changed)"
          docker build --pull -t "$IMAGE" "$RUNNER_TEMP/ros-ci-image"
          if [[ "$TRUSTED" == true ]]; then docker push -q "$IMAGE"; fi
      - name: Build and test selected packages
        id: run
        if: steps.lookup.outputs.cache-hit != 'true'
        run: |
          docker run --rm --network host --ipc host \
            -v "$GITHUB_WORKSPACE/ws:/ws" -v "$ROS_CI_TOOLING:/tooling:ro" -w /ws \
            -e ROS_CI_TOOLING=/tooling -e ROS_LOCALHOST_ONLY=1 \
            -e CCACHE_DIR=/ws/.ccache -e CCACHE_MAXSIZE=1G \
            -e MCB_FIRMWARE_BINARY="/ws/$MCB_FIRMWARE_ELF" \
            "$IMAGE" bash /tooling/.github/scripts/ros_ci_container.sh
      - name: Choose state key
        id: result
        if: always() && steps.run.outcome != 'skipped'
        env:
          STATE: ${{ steps.plan.outputs.state }}
        run: |
          result=$(cat ws/.ros-ci/result 2>/dev/null || echo none)
          # An exact key means every scope package passed; partial keys only seed rebuilds.
          case "$result" in
            passed) echo "key=ros-state-v1-$PACKAGE_REPO-$STATE" >> "$GITHUB_OUTPUT" ;;
            built) echo "key=ros-state-v1-$PACKAGE_REPO-partial-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Save install tree and package keys
        if: always() && steps.result.outputs.key != '' && steps.state.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ws/install
            ws/.ros-ci/manifest.json
          key: ${{ steps.result.outputs.key }}
      - name: Save compiler cache
        if: always() && steps.ccache.outcome == 'success' && steps.ccache.outputs.cache-hit != 'true' && steps.result.outputs.key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ws/.ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}
      - name: Save hosted firmware
        if: always() && steps.firmware.outcome == 'success' && steps.firmware.outputs.cache-hit != 'true' && hashFiles(format('ws/{0}', env.MCB_FIRMWARE_ELF)) != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ws/${{ env.MCB_FIRMWARE_ELF }}
          key: ${{ steps.firmware.outputs.cache-primary-key }}
      - name: Archive install tree
        if: steps.run.outcome == 'success'
        working-directory: ws
        run: tar -czf ros-jazzy-install.tar.gz install
      - name: Upload build and test reports
        if: always() && steps.run.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ros-jazzy-${{ inputs.package-repo }}-${{ github.sha }}
          path: |
            ws/log
            ws/build/**/test_results
            ws/.ros-ci
            ws/${{ env.MCB_FIRMWARE_ELF }}
            ws/ros-jazzy-install.tar.gz
          retention-days: 14

  isaac:
    if: github.event_name == 'workflow_dispatch' && (inputs.package-repo == 'isaac_ros_common' || inputs.package-repo == 'realsense-yolov8-nitros-bridge')
    runs-on: [self-hosted, Linux, isaac-ros-jazzy]
    environment: isaac-ros-ci
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      PACKAGE_REPO: ${{ inputs.package-repo }}
      ISAAC_ROS_CI_UNDERLAY: ${{ vars.ISAAC_ROS_CI_UNDERLAY }}
      ROS_LOCALHOST_ONLY: '1'
    steps:
      - name: Checkout pinned workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.workspace-ref }}
          path: ws/src
          persist-credentials: false
      - name: Checkout GPU package and source dependencies
        working-directory: ws/src
        run: |
          git submodule update --init --depth 1 -- \
            "$PACKAGE_REPO" ros2_dji_serial_bridge Realsense_ROI_Depth_Rectifier
      - name: Build and test against provisioned Isaac ROS 4.6
        working-directory: ws
        run: |
          source /opt/ros/jazzy/setup.bash
          if [[ -z "$ISAAC_ROS_CI_UNDERLAY" || ! -f "$ISAAC_ROS_CI_UNDERLAY/setup.bash" ]]; then
            echo 'Set ISAAC_ROS_CI_UNDERLAY to the provisioned Isaac ROS 4.6 install directory.' >&2
            exit 1
          fi
          source "$ISAAC_ROS_CI_UNDERLAY/setup.bash"
          mapfile -t packages < <(colcon list --base-paths "src/$PACKAGE_REPO" --names-only)
          [[ ${#packages[@]} -gt 0 ]]
          colcon build --packages-up-to "${packages[@]}" --parallel-workers 2 \
            --event-handlers console_direct+ --cmake-args -DBUILD_TESTING=ON
          source install/setup.bash
          colcon test --packages-select "${packages[@]}" \
            --event-handlers console_direct+ --return-code-on-test-failure
          colcon test-result --verbose
          tar -czf ros-jazzy-install.tar.gz install
      - name: Upload GPU build and test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isaac-jazzy-${{ inputs.package-repo }}-${{ github.run_id }}
          path: |
            ws/log
            ws/build/**/test_results
            ws/ros-jazzy-install.tar.gz
          retention-days: 14
