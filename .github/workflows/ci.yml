name: CI

on:
  push:
    branches: [main, nightly]
  pull_request:
    branches: [main, nightly]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helpers:
    name: Host helpers / ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: isaac-ros-startup
            suite: startup
          - package: isaac_ros_common
            suite: common
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Checkout the pinned helper package
        env:
          PACKAGE: ${{ matrix.package }}
        run: git submodule update --init --checkout --depth 1 -- "$PACKAGE"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/quality/requirements.txt
      - name: Test host helpers
        env:
          PACKAGE: ${{ matrix.package }}
          UNIT_SUITE: ${{ matrix.suite }}
        run: bash .github/scripts/test_host_packages.sh "$PACKAGE" "$UNIT_SUITE"
      - name: Upload host test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: host-tests-${{ matrix.suite }}-${{ github.sha }}
          path: ${{ matrix.package }}/build/host-tests
          retention-days: 14
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch package histories at pinned commits
        run: |
          mapfile -t paths < <(git config -f .gitmodules --get-regexp '\.path$' | cut -d' ' -f2)
          git submodule update --init --checkout --filter=blob:none -- "${paths[@]}"
      - name: Check commits, gitlinks and message stamps with the base checker
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          checker="$RUNNER_TEMP/checker/.github/quality/policy.py"
          mkdir -p "$(dirname "$checker")"
          if [[ ! "$BASE" =~ ^0*$ ]] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            source="$BASE"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            source=origin/main
          else
            source=origin/nightly
          fi
          if git cat-file -e "$source:.github/quality/policy.py" 2>/dev/null; then
            git show "$source:.github/quality/policy.py" > "$checker"
            echo "Policy checker from $source ($(git rev-parse "$source"))"
          else
            cp .github/quality/policy.py "$checker"
            echo "::warning title=Policy bootstrap::$source has no checker; using the revision under test"
          fi
          python3 "$checker" ci
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      tooling-ref: ${{ github.sha }}
  ros:
    uses: ./.github/workflows/ros.yml
    with:
      package-repo: workspace
      workspace-ref: ${{ github.sha }}
