name: CI

on:
  push:
    branches-ignore: [humble, 'humble/**']
  pull_request:
    branches-ignore: [humble, 'humble/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      tooling-ref: ${{ github.sha }}
  ros:
    uses: ./.github/workflows/ros.yml
    with:
      package-repo: workspace
      workspace-ref: ${{ github.sha }}
