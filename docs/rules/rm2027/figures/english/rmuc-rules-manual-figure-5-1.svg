<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 1650" role="img" aria-labelledby="title desc">
<title id="title">RMUC Figure 5-1 Barrel Heat Monitoring and Cooling</title><desc id="desc">English flowchart based on the 2027 Chinese rules manual source diagram.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2f80d5"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#263746}.shape{fill:#fff;stroke:#2f80d5;stroke-width:2}.decision{fill:#fff;stroke:#2f80d5;stroke-width:2}.arrow{fill:none;stroke:#2f80d5;stroke-width:2;marker-end:url(#arrow)}.branch{font-size:19px;font-weight:bold;fill:#2f80d5}.node{font-size:22px;text-anchor:middle}.small{font-size:19px;text-anchor:middle}.note{font-size:18px;text-anchor:start}.heading{font-size:25px;font-weight:bold;text-anchor:middle}</style>
<text x="525" y="49.0" class="heading"><tspan x="525" dy="0">Two independent checks run continuously</tspan></text>
<text x="330" y="97.0" class="heading"><tspan x="330" dy="0">PROJECTILE HEAT CHECK</tspan></text>
<ellipse cx="330.0" cy="150.0" rx="150.0" ry="30.0" class="shape"/>
<text x="330.0" y="157.0" class="node"><tspan x="330.0" dy="0">Monitor for projectile</tspan></text>
<path d="M330 180 V215" class="arrow"/>
<rect x="180" y="215" width="300" height="70" rx="8" class="shape"/>
<text x="330.0" y="257.0" class="node"><tspan x="330.0" dy="0">Detect one projectile</tspan></text>
<path d="M330 285 V320" class="arrow"/>
<polygon points="330.0,320 465,372.5 330.0,425 195,372.5" class="decision"/>
<text x="330.0" y="379.5" class="small"><tspan x="330.0" dy="0">Projectile is 17 mm?</tspan></text>
<text x="465" y="380" class="branch">YES</text>
<path d="M465 372 H600 V450" class="arrow"/>
<rect x="500" y="450" width="220" height="70" rx="8" class="shape"/>
<text x="610.0" y="492.0" class="node"><tspan x="610.0" dy="0">Q₁ = Q₁ + 10</tspan></text>
<text x="330" y="460" class="branch">NO</text>
<path d="M330 425 V450" class="arrow"/>
<rect x="220" y="450" width="220" height="70" rx="8" class="shape"/>
<text x="330.0" y="492.0" class="node"><tspan x="330.0" dy="0">Q₁ = Q₁ + 100</tspan></text>
<path d="M610 520 V555 H330 V585" class="arrow"/>
<path d="M330 520 V555" class="arrow"/>
<polygon points="330.0,585 465,635.0 330.0,685 195,635.0" class="decision"/>
<text x="330.0" y="642.0" class="small"><tspan x="330.0" dy="0">Q₁ ≥ Q₂?</tspan></text>
<text x="465" y="642" class="branch">YES</text>
<path d="M465 635 H590" class="arrow"/>
<rect x="590" y="590" width="390" height="92" rx="8" class="shape"/>
<text x="785.0" y="629.5" class="node"><tspan x="785.0" dy="0">Launcher locked for remainder</tspan><tspan x="785.0" dy="27">of the round; cannot unlock</tspan></text>
<text x="330" y="730" class="branch">NO</text>
<path d="M330 685 V735" class="arrow"/>
<polygon points="330.0,735 465,785.0 330.0,835 195,785.0" class="decision"/>
<text x="330.0" y="792.0" class="small"><tspan x="330.0" dy="0">Q₁ &gt; Q₀?</tspan></text>
<text x="465" y="792" class="branch">YES</text>
<path d="M465 785 H590" class="arrow"/>
<rect x="590" y="740" width="390" height="92" rx="8" class="shape"/>
<text x="785.0" y="779.5" class="node"><tspan x="785.0" dy="0">Launcher locked; video feed</tspan><tspan x="785.0" dy="27">disconnected</tspan></text>
<text x="330" y="878" class="branch">NO</text>
<path d="M330 835 V890" class="arrow"/>
<ellipse cx="330.0" cy="922.0" rx="150.0" ry="32.0" class="shape"/>
<text x="330.0" y="929.0" class="node"><tspan x="330.0" dy="0">Continue projectile monitoring</tspan></text>
<path d="M980 636 H1020 V250 H480" class="arrow"/>
<path d="M980 786 H1035 V250 H480" class="arrow"/>
<path d="M180 922 H35 V250 H180" class="arrow"/>
<path d="M60 1000 H990" stroke="#d7e4f0" stroke-width="2"/>
<text x="525" y="1047.0" class="heading"><tspan x="525" dy="0">100 ms COOLING CHECK</tspan></text>
<ellipse cx="525.0" cy="1100.0" rx="150.0" ry="30.0" class="shape"/>
<text x="525.0" y="1107.0" class="node"><tspan x="525.0" dy="0">Cooling loop</tspan></text>
<path d="M525 1130 V1165" class="arrow"/>
<polygon points="525.0,1165 665,1215.0 525.0,1265 385,1215.0" class="decision"/>
<text x="525.0" y="1208.5" class="small"><tspan x="525.0" dy="0">100 ms detection</tspan><tspan x="525.0" dy="27">cycle reached?</tspan></text>
<text x="670" y="1222" class="branch">NO</text>
<path d="M665 1215 H900 V1100 H675" class="arrow"/>
<text x="525" y="1300" class="branch">YES</text>
<path d="M525 1265 V1310" class="arrow"/>
<rect x="345" y="1310" width="360" height="70" rx="8" class="shape"/>
<text x="525.0" y="1352.0" class="node"><tspan x="525.0" dy="0">Q₁ = Q₁ − cooling rate / 10</tspan></text>
<path d="M525 1380 V1400" class="arrow"/>
<polygon points="525.0,1400 665,1450.0 525.0,1500 385,1450.0" class="decision"/>
<text x="525.0" y="1457.0" class="small"><tspan x="525.0" dy="0">Q₁ ≤ 0?</tspan></text>
<text x="670" y="1458" class="branch">NO</text>
<path d="M665 1450 H930 V1215 H665" class="arrow"/>
<text x="365" y="1480" class="branch">YES</text>
<path d="M385 1450 H365 V1502 H350" class="arrow"/>
<rect x="60" y="1455" width="290" height="95" rx="8" class="shape"/>
<text x="205.0" y="1482.5" class="small"><tspan x="205.0" dy="0">Set Q₁ = 0; unlock</tspan><tspan x="205.0" dy="27">launcher; restore</tspan><tspan x="205.0" dy="27">video feed</tspan></text>
<text x="525" y="1627.0" class="small"><tspan x="525" dy="0">Q₀ = Barrel Heat Limit  ·  Q₁ = current heat  ·  Q₂ = lock threshold</tspan></text>
</svg>
