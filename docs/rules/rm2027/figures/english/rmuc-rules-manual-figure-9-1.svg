<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 949" role="img" aria-labelledby="title desc">
<title id="title">RMUC Figure 9-1 — Appeal Flowchart</title><desc id="desc">English flowchart based on the 2027 Chinese rules manual source diagram.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2f80d5"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#263746}.shape{fill:#fff;stroke:#2f80d5;stroke-width:2}.decision{fill:#fff;stroke:#2f80d5;stroke-width:2}.arrow{fill:none;stroke:#2f80d5;stroke-width:2;marker-end:url(#arrow)}.branch{font-size:19px;font-weight:bold;fill:#2f80d5}.node{font-size:22px;text-anchor:middle}.small{font-size:19px;text-anchor:middle}.note{font-size:18px;text-anchor:start}.heading{font-size:25px;font-weight:bold;text-anchor:middle}</style>
<rect x="125.0" y="55" width="380" height="82" rx="8" class="shape"/>
<text x="315.0" y="89.5" class="small"><tspan x="315.0" dy="0">Participating team submits</tspan><tspan x="315.0" dy="27">Appeal</tspan></text>
<path d="M505 127.0 H530" stroke="#8aaed3" stroke-width="2" stroke-dasharray="5 6"/>
<rect x="540" y="55" width="620" height="144" rx="10" fill="#f4f8fc" stroke="#2f80d5" stroke-width="2"/>
<text x="554" y="73" class="note">Within 5 min of match end; group stage may appeal all</text>
<text x="554" y="97" class="note">rounds, knockout loser may appeal rounds it lost. Captain</text>
<text x="554" y="121" class="note">submits at result desk; confirmation consumes the</text>
<text x="554" y="145" class="note">opportunity. No Appeals before/during match or after</text>
<text x="554" y="169" class="note">signing/deadline. Committee may isolate relevant robots.</text>
<path d="M315 200 V217" class="arrow"/>
<rect x="125.0" y="217" width="380" height="82" rx="8" class="shape"/>
<text x="315.0" y="251.5" class="small"><tspan x="315.0" dy="0">Team fills in Appeal form and</tspan><tspan x="315.0" dy="27">signs</tspan></text>
<path d="M505 277.0 H530" stroke="#8aaed3" stroke-width="2" stroke-dasharray="5 6"/>
<rect x="540" y="217" width="620" height="120" rx="10" fill="#f4f8fc" stroke="#2f80d5" stroke-width="2"/>
<text x="554" y="235" class="note">Captain submits within 10 min; up to 2 personnel may</text>
<text x="554" y="259" class="note">assist. Committee reviews only “Appeal reason”; it cannot</text>
<text x="554" y="283" class="note">later change. Missed deadline means no reason and original</text>
<text x="554" y="307" class="note">result stands.</text>
<path d="M315 338 V355" class="arrow"/>
<rect x="125.0" y="355" width="380" height="82" rx="8" class="shape"/>
<text x="315.0" y="389.5" class="small"><tspan x="315.0" dy="0">Team collects evidence or</tspan><tspan x="315.0" dy="27">defense materials</tspan></text>
<path d="M505 415.0 H530" stroke="#8aaed3" stroke-width="2" stroke-dasharray="5 6"/>
<rect x="540" y="355" width="620" height="120" rx="10" fill="#f4f8fc" stroke="#2f80d5" stroke-width="2"/>
<text x="554" y="373" class="note">Submit to Chief Referee within 30 min after acceptance;</text>
<text x="554" y="397" class="note">arrange time/place and explain materials. No late</text>
<text x="554" y="421" class="note">material. Skip if none is needed, evidence is sufficient,</text>
<text x="554" y="445" class="note">or reason is ineligible.</text>
<path d="M315 476 V493" class="arrow"/>
<rect x="125.0" y="493" width="380" height="82" rx="8" class="shape"/>
<text x="315.0" y="527.5" class="small"><tspan x="315.0" dy="0">Appeal result announced to</tspan><tspan x="315.0" dy="27">both parties</tspan></text>
<path d="M505 565.0 H530" stroke="#8aaed3" stroke-width="2" stroke-dasharray="5 6"/>
<rect x="540" y="493" width="620" height="144" rx="10" fill="#f4f8fc" stroke="#2f80d5" stroke-width="2"/>
<text x="554" y="511" class="note">Captains attend arbitration room within 10 min. In person</text>
<text x="554" y="535" class="note">only; max 3 official team members/advisors per side.</text>
<text x="554" y="559" class="note">Absence waives participation. Ineligible or clearly false</text>
<text x="554" y="583" class="note">reasons may be explained only to appellant; original</text>
<text x="554" y="607" class="note">result stands.</text>
<path d="M315 638 V655" class="arrow"/>
<rect x="125.0" y="655" width="380" height="76" rx="8" class="shape"/>
<text x="315.0" y="700.0" class="small"><tspan x="315.0" dy="0">Appeal result confirmed</tspan></text>
<path d="M505 715.0 H530" stroke="#8aaed3" stroke-width="2" stroke-dasharray="5 6"/>
<rect x="540" y="655" width="620" height="120" rx="10" fill="#f4f8fc" stroke="#2f80d5" stroke-width="2"/>
<text x="554" y="673" class="note">One representative per side signs. No later objection;</text>
<text x="554" y="697" class="note">unsigned after 5 min means acknowledged. If appellant’s</text>
<text x="554" y="721" class="note">reason is ineligible/clearly false, other side need not</text>
<text x="554" y="745" class="note">sign.</text>
<path d="M315 776 V793" class="arrow"/>
<rect x="125.0" y="793" width="380" height="76" rx="8" class="shape"/>
<text x="315.0" y="838.0" class="small"><tspan x="315.0" dy="0">Continued Appeal</tspan></text>
<path d="M505 853.0 H530" stroke="#8aaed3" stroke-width="2" stroke-dasharray="5 6"/>
<rect x="540" y="793" width="620" height="120" rx="10" fill="#f4f8fc" stroke="#2f80d5" stroke-width="2"/>
<text x="554" y="811" class="note">After a “both sides replay” ruling, a team with an</text>
<text x="554" y="835" class="note">opportunity may appeal the replay. The original</text>
<text x="554" y="859" class="note">appellant’s opportunity is consumed whether successful or</text>
<text x="554" y="883" class="note">not.</text>
</svg>
