<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 1160" role="img" aria-labelledby="title desc">
<title id="title">RMUC Figure 5-4 Offline Module Monitoring</title><desc id="desc">English flowchart translated from the 2027 Chinese rules manual.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2f80d5"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#263746}.shape{fill:white;stroke:#2f80d5;stroke-width:2}.decision{fill:#fff;stroke:#2f80d5;stroke-width:2}.arrow{fill:none;stroke:#2f80d5;stroke-width:2;marker-end:url(#arrow)}.branch{font-size:18px;font-weight:700;fill:#2f80d5}.node{font-size:20px;text-anchor:middle}.small{font-size:17px;text-anchor:middle}.step{font-size:19px;font-weight:700}.anno{font-size:16px;text-anchor:middle}.title{font-size:26px;font-weight:700}</style>
<ellipse cx="485.0" cy="70.0" rx="155.0" ry="30.0" class="shape"/>
<text x="485.0" y="76.0" class="node"><tspan x="485.0" dy="0">Start / repeat</tspan></text>
<path d="M485 100 V140" class="arrow"/>
<polygon points="485.0,140 630,192.5 485.0,245 340,192.5" class="decision"/>
<text x="485.0" y="186.0" class="small"><tspan x="485.0" dy="0">500 ms detection</tspan><tspan x="485.0" dy="25">cycle reached?</tspan></text>
<text x="645" y="198" class="branch">NO</text>
<path d="M630 192 H820 V70 H640" class="arrow"/>
<text x="485" y="280" class="branch">YES</text>
<path d="M485 245 V290" class="arrow"/>
<polygon points="485.0,290 625,342.5 485.0,395 345,342.5" class="decision"/>
<text x="485.0" y="336.0" class="small"><tspan x="485.0" dy="0">Speed Monitor</tspan><tspan x="485.0" dy="25">Module offline?</tspan></text>
<text x="650" y="350" class="branch">NO</text>
<path d="M625 342 H790 V380" class="arrow"/>
<rect x="690" y="380" width="220" height="75" rx="8" class="shape"/>
<text x="800.0" y="411.0" class="node"><tspan x="800.0" dy="0">No additional</tspan><tspan x="800.0" dy="25">handling</tspan></text>
<path d="M800 455 V500 H820 V192 H630" class="arrow"/>
<text x="485" y="430" class="branch">YES</text>
<path d="M485 395 V450" class="arrow"/>
<rect x="320" y="450" width="330" height="80" rx="8" class="shape"/>
<text x="485.0" y="483.5" class="node"><tspan x="485.0" dy="0">Lock corresponding</tspan><tspan x="485.0" dy="25">17 mm / 42 mm launcher</tspan></text>
<path d="M485 530 V570" class="arrow"/>
<polygon points="485.0,570 625,625.0 485.0,680 345,625.0" class="decision"/>
<text x="485.0" y="618.5" class="small"><tspan x="485.0" dy="0">Module reconnected</tspan><tspan x="485.0" dy="25">to server?</tspan></text>
<text x="650" y="632" class="branch">NO</text>
<path d="M625 625 H820 V192 H630" class="arrow"/>
<text x="485" y="710" class="branch">YES</text>
<path d="M485 680 V730" class="arrow"/>
<rect x="320" y="730" width="330" height="80" rx="8" class="shape"/>
<text x="485.0" y="763.5" class="node"><tspan x="485.0" dy="0">Unlock corresponding</tspan><tspan x="485.0" dy="25">17 mm / 42 mm launcher</tspan></text>
<path d="M650 770 H820 V192 H630" class="arrow"/>
<text x="485" y="1060" class="small">The Referee System repeats this check at 2 Hz.</text>
</svg>
